<!DOCTYPE html>
<html data-sly-use.report="com.adobe.acs.commons.mcp.model.ReportPage">
    <head>
        <title>${report.name}</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
             data-sly-call="${clientlib.all @ categories='coralui3'}"/>
    </head>
    <body class="coral--light">
        <div style="padding: 1rem 2rem;">
            <nav aria-label="Report pagination">
                <p aria-live="polite">Rows ${report.firstRow}–${report.lastRow} of ${report.totalRows}; page ${report.pageNumber} of ${report.pageCount}.</p>
                <a data-sly-test="${report.hasPrevious}" is="coral-anchorbutton"
                   href="${report.previousUrl}">Previous</a>
                <a data-sly-test="${report.hasNext}" is="coral-anchorbutton"
                   href="${report.nextUrl}">Next</a>
                <form method="get" action="${request.requestURI}">
                    <label>Rows per page <input type="number" name="pageSize" min="1" max="500" value="${report.pageSize}"/></label>
                    <button is="coral-button" type="submit">Apply</button>
                </form>
            </nav>
            <table is="coral-table" lockable>
                <colgroup data-sly-list.column="${report.columnNames}">
                    <col is="coral-table-column" sortable orderable/>
                    <col    data-sly-test="${columnList.last}"
                            is="coral-table-column"/>
                </colgroup>
                <thead is="coral-table-head" sticky>
                    <tr is="coral-table-row"
                        data-sly-list.column="${report.columnNames}">
                        <th is="coral-table-headercell">${column}</th>
                        <th is="coral-table-headercell"
                            data-sly-test="${columnList.last}"></th>
                    </tr>
                </thead>
                <tbody is="coral-table-body"
                       data-sly-list.row="${report.rows}">
                    <tr is="coral-table-row"
                        data-sly-list.column="${report.columns}">
                        <td is="coral-table-cell">${row[column]}</td>
                        <td is="coral-table-cell"
                            data-sly-test="${columnList.last}">
                            <button is="coral-button" type="button" icon="lockOn" variant="minimal" coral-table-rowlock></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
