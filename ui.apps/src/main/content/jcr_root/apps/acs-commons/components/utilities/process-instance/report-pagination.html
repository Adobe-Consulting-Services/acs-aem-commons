<template data-sly-template.controls="${@ report, position}">
    <nav class="mcp-report-pagination" aria-label="Report pagination ${position}">
        <div class="mcp-report-pagination__summary">
            <span class="coral-Body--small">Rows ${report.firstRow}–${report.lastRow} of ${report.totalRows}</span>
        </div>
        <form class="mcp-report-pagination__size" method="get" action="${request.requestURI}">
            <label for="report-page-size-${position}">Rows per page</label>
            <input is="coral-textfield" class="mcp-report-pagination__input" id="report-page-size-${position}"
                   type="number" name="pageSize" min="1" max="500" required value="${report.pageSize}"/>
            <button is="coral-button" variant="secondary" type="submit">Apply</button>
        </form>
        <div class="mcp-report-pagination__navigation">
            <a data-sly-test="${report.hasPrevious}" is="coral-anchorbutton" variant="secondary"
               icon="chevronLeft" href="${report.previousUrl}" rel="prev" aria-label="Go to previous report page">Previous</a>
            <button data-sly-test="${!report.hasPrevious}" is="coral-button" variant="secondary"
                    icon="chevronLeft" type="button" disabled aria-label="Previous page unavailable">Previous</button>
            <span class="mcp-report-pagination__page" aria-live="polite">Page ${report.pageNumber} of ${report.pageCount}</span>
            <a data-sly-test="${report.hasNext}" is="coral-anchorbutton" variant="secondary"
               icon="chevronRight" href="${report.nextUrl}" rel="next" aria-label="Go to next report page">Next</a>
            <button data-sly-test="${!report.hasNext}" is="coral-button" variant="secondary"
                    icon="chevronRight" type="button" disabled aria-label="Next page unavailable">Next</button>
        </div>
    </nav>
</template>
